# Support Engram publishes about itself.
#
# Everything here is taken from this project's own README and CLI reference. No
# symptom is described that the project does not already document, and where the
# machine cannot answer a question, a person is asked one with a bounded set of
# answers -- free text never travels.

endpoint: https://github.com/dx111ge/engram/issues
commit: v1.2.0
status: active

langs: [en, de]

# We owe English and nothing more, so a reader in another language meets every
# sentence below through their own model -- and a small model turns a product's
# term into the ordinary word it resembles. These four are ours and must arrive
# as written:
#
#   Engram   German already has "Engramm" for a memory trace, and that is not us
#   brain    a knowledge base and the file that holds it, not an organ; it came
#            back as "cerveau" and "Gehirn" before anyone listed it here
#   Debate   a feature, not the activity, and German writes it "Debatte"
#   Chat     a feature -- and in French "chat" is a cat, so "Debate and Chat
#            fail" becomes a sentence about a cat that has stopped working
#
# Matching is case-insensitive and stands on word boundaries, so one entry
# covers "Engram" and the `engram` command, and "brain" covers "my.brain"
# without touching "brainstorm".
glossary:
  keep: [Engram, brain, Debate, Chat]

# The name is what a rule matches on and what a solution answers. `describes` is
# the line a person picks it by, and it is ours to write because we are the only
# ones who know what the symptom looks like from outside. Each is the opening
# sentence of the solution it leads to: what they see, not what is wrong.
problem_classes:
  - id: engram.start.wrong-build
    describes: Engram does not start at all - no window, or "cannot execute binary file"
  - id: engram.search.stale-after-model-change
    describes: Search stopped finding things it used to find
  - id: engram.llm.model-not-pulled
    describes: Debate and Chat fail, but storing knowledge and search still work

collect:
  # Engram publishes four builds and they are not interchangeable. This is the
  # one reading that settles which of them belongs on this machine, and it costs
  # no execution at all.
  - id: os.arch
    kind: machine
    describes: Processor architecture
    why: Engram ships separate x86_64 and aarch64 builds, and the wrong one
         does not start
    read: { op: os_fact, name: arch }

  # `name: os`, not `name: name`. The op takes one of `os`, `arch`, `version` or
  # `container`; anything else reads nothing at all and says nothing about it,
  # so this probe was silently empty and every rule that needed it could never
  # match. Found on 2026-09-16 by somebody on Linux saying they had downloaded
  # the Windows archive and being told nothing was wrong.
  - id: os.name
    kind: machine
    describes: Operating system
    why: The Windows, Linux and macOS downloads are different archives
    read: { op: os_fact, name: os }

  # Asked of a person, because nothing on the machine records which archive was
  # downloaded. `choices` is what lets this fact travel at all.
  - id: engram.download
    kind: human
    describes: Which archive was downloaded
    why: A build for another architecture is the most common reason the binary
         does not start
    prompt: Which file did you download from the releases page?
    choices:
      - engram-linux-x86_64.zip
      - engram-linux-aarch64.zip
      - engram-windows-x86_64.zip
      - engram-macos-aarch64.zip
      - I built it from source
      - I do not remember

  - id: engram.embedding_changed
    kind: human
    describes: Whether the embedding model was changed
    why: Nodes are embedded when they are stored, so changing the model leaves
         every existing node embedded by the old one until `engram reindex` runs
    prompt: Did you change the embedding model under System > Embeddings after
            storing knowledge?
    choices:
      - "yes, and I did not run engram reindex"
      - "yes, and I did run engram reindex"
      - "no"
      - I do not know

  - id: engram.llm_endpoint
    kind: human
    describes: Which LLM endpoint is configured
    why: Debate and chat need an OpenAI-compatible endpoint that answers, and
         the recommended local setup needs its model pulled first
    prompt: What is configured under System > LLM?
    choices:
      - Ollama on this machine
      - another OpenAI-compatible endpoint
      - nothing is configured yet
      - I do not know

escalate:
  reason: Nothing published matches these readings, and it may be a defect
          rather than a setup problem
  queue: github-issues
  target: https://github.com/dx111ge/engram/issues
  reply_via: [ticket_url, none]

solutions:
  # One answer per operating system, because `when` compares readings and cannot
  # say "the archive and the machine disagree". The last of the four is what to
  # do when the archive is not known yet -- and it is conditioned on exactly
  # that, not merely on the operating system, which is what it said first and
  # which made it answer in place of all three: a rule whose condition is a
  # subset of another's is reached first and the specific answer never fires.
  - solutions/wrong-archive-for-this-system.md
  - solutions/wrong-archive-on-windows.md
  - solutions/wrong-archive-on-macos.md
  - solutions/wrong-build-for-this-machine.md
  - solutions/find-out-which-archive.md
  - solutions/search-stale-after-model-change.md
  - solutions/llm-model-not-pulled.md
